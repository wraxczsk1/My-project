[project]
name = "lspd-manual"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "Pillow>=10.4,<12",
    "Authlib>=1.3,<2",
    "requests>=2.31,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "a2wsgi>=1.10,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
