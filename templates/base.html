<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Obsah{% endblock %} · LSPD MANUAL</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="{{ url_for('index') }}">
    <span class="star">★</span>
    <span><b>LSPD MANUAL</b><small>Los Santos Police Department</small></span>
  </a>
  <nav>
    <a href="{{ url_for('index') }}" class="home {{ 'active' if request.endpoint == 'index' }}">Obsah výcviku</a>
    {% for c in categories %}
      <a href="{{ url_for('category', cat=c.slug) }}" class="cat-link {{ 'active' if active_cat == c.slug }}" style="--cat: {{ c.barva }}">
        <span class="icon">{{ c.ikona }}</span><span class="name">{{ c.nazev }}</span><span class="count">{{ c.moduly|length }}</span>
      </a>
    {% endfor %}
  </nav>
  <a class="btn gold full" href="{{ url_for('manual_zip') }}">⬇ Stáhnout vše (ZIP)</a>
</aside>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
